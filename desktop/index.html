<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bow Desktop</title>
  <link rel="stylesheet" href="desktop.css" />
</head>
<body>
  <div id="desktop">
    <div id="desktop-icons"></div>

    <button id="addProgramsBtn">➕ Add Programs</button>

    <div id="taskbar">
      <button id="startBtn">🦄 Bow</button>
      <div id="runningApps"></div>
      <div id="clock"></div>
    </div>

    <div id="startMenu" class="hidden">
      <h2>Bow Desktop</h2>
      <div id="appList"></div>
    </div>

    <div id="storeWindow" class="hidden">
      <h2>Program Store</h2>
      <div id="storeApps"></div>
    </div>
  </div>

  <script src="desktop.js"></script>
</body>
</html>
