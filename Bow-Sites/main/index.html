<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bow Service Self Hosted Sites</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#6d28d9 0%,#111827 55%);
    color:white;
    min-height:100vh;
    overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    width:100%;
    padding:22px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(8px);
    box-shadow:0 4px 18px rgba(0,0,0,0.4);
}

/* =========================
   CENTER
========================= */

.center{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:calc(100vh - 90px);
    padding:20px;
}

/* =========================
   MAIN BOX
========================= */

.box{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:24px;
    padding:45px;
    text-align:center;
    backdrop-filter:blur(14px);
    box-shadow:0 15px 45px rgba(0,0,0,0.45);
}

/* =========================
   TITLE
========================= */

.title{
    font-size:34px;
    font-weight:bold;
    margin-bottom:12px;
}

.subtitle{
    font-size:16px;
    opacity:0.8;
    margin-bottom:30px;
}

/* =========================
   INPUT
========================= */

.inputWrap{
    position:relative;
    width:100%;
}

input{
    width:100%;
    padding:18px;
    border:none;
    border-radius:16px;
    outline:none;
    font-size:20px;
    text-align:center;
    background:#fff;
    color:#111;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

/* =========================
   BUTTON
========================= */

button{
    margin-top:22px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:#8b5cf6;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 8px 25px rgba(139,92,246,0.45);
}

button:hover{
    background:#7c3aed;
    transform:translateY(-2px);
}

/* =========================
   INFO
========================= */

.hint{
    margin-top:22px;
    opacity:0.75;
    font-size:14px;
    line-height:1.6;
}

.error{
    margin-top:18px;
    color:#fecaca;
    font-weight:bold;
}

/* =========================
   LOADING OVERLAY
========================= */

.loading{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999999;
}

/* Spinner */

.spinner{
    width:95px;
    height:95px;
    border:6px solid rgba(255,255,255,0.15);
    border-top:6px solid #facc15;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:26px;
}

.loadingTitle{
    font-size:30px;
    margin-bottom:12px;
}

.loadingSub{
    opacity:0.8;
    font-size:18px;
}

/* Animation */

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   FOOTER
========================= */

.footer{
    margin-top:28px;
    font-size:12px;
    opacity:0.5;
}

</style>
</head>

<body>

<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">
    Bow Service Self Hosted Sites
</div>

<!-- =========================
     CENTER
========================= -->

<div class="center">

    <div class="box">

        <div class="title">
            Enter Domain or URL
        </div>

        <div class="subtitle">
            Open your custom Bow-hosted websites instantly
        </div>

        <div class="inputWrap">

            <input
                id="domainInput"
                placeholder="example: mysite.bow"
                autofocus
            >

        </div>

        <button id="openBtn">
            Open Site
        </button>

        <div class="hint">
            Example folder:<br>
            Bow-Sites/mysite.bow/index.html
        </div>

        <div id="error" class="error"></div>

        <div class="footer">
            Designed and deployed by Bow
        </div>

    </div>

</div>

<!-- =========================
     LOADING
========================= -->

<div id="loading" class="loading">

    <div class="spinner"></div>

    <div class="loadingTitle">
        The magical service of Bow is loading
    </div>

    <div class="loadingSub">
        Please wait...
    </div>

</div>

<script>

const GITHUB_USER = "PotterService";
const REPO_NAME = "magic-scripts";
const BOW_SITES_PATH = "Bow-Sites";

/* =========================
   OPEN SITE
========================= */

function openSite(){

    const input =
        document
        .getElementById("domainInput")
        .value
        .trim();

    const error =
        document
        .getElementById("error");

    error.textContent = "";

    if(!input){

        error.textContent =
            "Please enter a domain.";

        return;
    }

    let clean =
        input
        .toLowerCase()
        .replace(/^https?:\\/\\//,"")
        .replace(/^www\\./,"")
        .replace(/\\/$/,"");

    if(!clean.includes(".")){

        error.textContent =
            "Enter a full domain like mysite.bow";

        return;
    }

    // SHOW LOADING

    document
        .getElementById("loading")
        .style
        .display = "flex";

    // FINAL URL

    const finalUrl =
        "https://" +
        GITHUB_USER +
        ".github.io/" +
        REPO_NAME +
        "/" +
        BOW_SITES_PATH +
        "/" +
        clean +
        "/";

    // DELAY

    setTimeout(() => {

        window.location.href = finalUrl;

    },1500);

}

/* =========================
   EVENTS
========================= */

document
    .getElementById("openBtn")
    .addEventListener("click",openSite);

document
    .getElementById("domainInput")
    .addEventListener("keydown",function(e){

        if(e.key === "Enter"){

            openSite();

        }

});

</script>

</body>
</html>
