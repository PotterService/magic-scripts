<!DOCTYPE html>
<html>
<head>
<title>Bow Service Self Hosted Sites</title>
</head>

<body style="background:#111;color:white;font-family:Arial;text-align:center;padding-top:120px;">

<h1>Bow Service Self Hosted Sites</h1>

<h2>Enter domain or URL below</h2>

<input id="domainInput" placeholder="test.bow" style="padding:15px;font-size:22px;width:300px;text-align:center;">

<br><br>

<button id="openBtn" style="padding:15px 30px;font-size:18px;">
Open Site
</button>

<p id="error" style="color:#ff9999;font-weight:bold;"></p>

<script>
const GITHUB_USER = "PotterService";
const REPO_NAME = "magic-scripts";
const BOW_SITES_PATH = "Bow-Sites";

function openSite() {
    const input = document.getElementById("domainInput").value.trim();
    const error = document.getElementById("error");

    error.textContent = "";

    if (!input) {
        error.textContent = "Please enter a domain.";
        return;
    }

    let clean = input
        .toLowerCase()
        .replace(/^https?:\/\//, "")
        .replace(/^www\./, "")
        .replace(/\/$/, "");

    if (!clean.includes(".")) {
        error.textContent = "Enter a domain like test.bow";
        return;
    }

    const folderName = clean.replace(/\./g, "-");

    const finalUrl =
        "https://" +
        GITHUB_USER +
        ".github.io/" +
        REPO_NAME +
        "/" +
        BOW_SITES_PATH +
        "/" +
        folderName +
        "/";

    window.location.href = finalUrl;
}

document.getElementById("openBtn").onclick = openSite;

document.getElementById("domainInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        openSite();
    }
});
</script>

</body>
</html>
